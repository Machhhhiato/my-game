[package]
name = "colony-to-stars"
version = "0.1.0"
description = "群星挂机 · 从坠落到银河 - M1 演示"
edition = "2021"

[lib]
name = "colony_to_stars_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
