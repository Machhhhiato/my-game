const nodeById=new Map(DATA.nodes.map(node=>[node.id,node]));
const parents=new Map(DATA.nodes.map(node=>[node.id,new Set(node.pre)]));
const children=new Map(DATA.nodes.map(node=>[node.id,new Set()]));
DATA.edges.forEach(edge=>children.get(edge.from).add(edge.to));
const nodeEls=new Map();
const edgeEls=[];
let selectedId='POP-REG-001';
let focusOnly=false;
let transform={x:24,y:30,scale:.68};
let drag=null;

world.style.width=DATA.meta.worldWidth+'px';
world.style.height=DATA.meta.worldHeight+'px';

svg.setAttribute('height',DATA.meta.worldHeight);
nodesLayer.style.width=DATA.meta.worldWidth+'px';
nodesLayer.style.height=DATA.meta.worldHeight+'px';

DATA.edges.forEach(edge=>{
  const source=nodeById.get(edge.from);const target=nodeById.get(edge.to);
  const x1=source.x+232,y1=source.y+32,x2=target.x,y2=target.y+32,mid=x1+(x2-x1)*.5;
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d',`M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}`);

  nodesLayer.appendChild(button);nodeEls.set(node.id,button);

function applyTransform(){world.style.transform=`translate(${transform.x}px,${transform.y}px) scale(${transform.scale})`}
function relatedSet(id){const result=new Set([id]);parents.get(id).forEach(value=>result.add(value));children.get(id).forEach(value=>result.add(value));return result}
function updateMarks(){
  const related=relatedSet(selectedId);
  nodeEls.forEach((el,id)=>{el.classList.toggle('is-selected',id===selectedId);el.classList.toggle('is-related',id!==selectedId&&related.has(id))});
  edgeEls.forEach(path=>{const direct=path.dataset.from===selectedId||path.dataset.to===selectedId;path.classList.toggle('is-related',direct);path.classList.toggle('is-hidden',focusOnly&&!direct)});
}
function row(label,value){if(value==null||value==='')return'';return `<div class="m1-detail-label">${escapeHtml(label)}</div><p class="m1-detail-value">${escapeHtml(value)}</p>`}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function renderDetail(node){
  const prereqs=node.preNames.length?node.preNames.join('、'):'无';
  let body=`<h2>${escapeHtml(node.name)}</h2><div class="m1-detail-grid">`;
  body+=row('直接前置科技',prereqs)+row('研究结果',node.researchResult)+row('明确解锁',node.unlock)+row('实体条件',node.entityConditions)+row('运行证明',node.proof);
  if(node.body!==node.researchResult)body+=row('正文',node.body);
  body+=row('第二段',node.second)+row('强度',node.strength)+row('形式',node.form)+'</div>';
  detail.innerHTML=body;
}
function centerNode(node,scale){
  const rect=viewport.getBoundingClientRect();transform.scale=scale;
  transform.x=rect.width*.5-(node.x+116)*scale;transform.y=rect.height*.44-(node.y+32)*scale;applyTransform();
}
function selectNode(id,center){selectedId=id;const node=nodeById.get(id);renderDetail(node);updateMarks();status.textContent='已选择：'+node.name;if(center)centerNode(node,Math.max(transform.scale,.76))}
function showOverview(){
  const rect=viewport.getBoundingClientRect();const sx=(rect.width-28)/DATA.meta.worldWidth;const sy=(rect.height-28)/DATA.meta.worldHeight;
  transform.scale=Math.min(sx,sy);transform.x=(rect.width-DATA.meta.worldWidth*transform.scale)/2;transform.y=(rect.height-DATA.meta.worldHeight*transform.scale)/2;applyTransform();status.textContent='正在查看整棵科技树';
}
function findTech(){
  const query=search.value.trim().toLocaleLowerCase();if(!query){status.textContent='请输入科技名称或正文关键词';return}
  const node=DATA.nodes.find(item=>[item.name,item.body,item.second,item.researchResult,item.unlock].some(value=>String(value||'').toLocaleLowerCase().includes(query)));
  if(!node){status.textContent='没有找到包含“'+search.value.trim()+'”的科技';return}selectNode(node.id,true);
}
root.querySelector('#m1-tech-find').addEventListener('click',findTech);
search.addEventListener('keydown',event=>{if(event.key==='Enter')findTech()});
root.querySelector('#m1-tech-overview').addEventListener('click',showOverview);
root.querySelector('#m1-tech-start').addEventListener('click',()=>selectNode('POP-REG-001',true));
root.querySelector('#m1-tech-focus').addEventListener('click',event=>{focusOnly=!focusOnly;event.currentTarget.setAttribute('aria-pressed',String(focusOnly));event.currentTarget.textContent=focusOnly?'显示全部连线':'只看关联线';updateMarks()});
viewport.addEventListener('wheel',event=>{
  event.preventDefault();const rect=viewport.getBoundingClientRect();const px=event.clientX-rect.left,py=event.clientY-rect.top;const worldX=(px-transform.x)/transform.scale,worldY=(py-transform.y)/transform.scale;
  const next=Math.min(1.35,Math.max(.08,transform.scale*(event.deltaY<0?1.12:.89)));transform.x=px-worldX*next;transform.y=py-worldY*next;transform.scale=next;applyTransform();
},{passive:false});
viewport.addEventListener('pointerdown',event=>{if(event.target.closest('.m1-tech-node'))return;drag={id:event.pointerId,x:event.clientX,y:event.clientY,tx:transform.x,ty:transform.y};viewport.setPointerCapture(event.pointerId);viewport.classList.add('is-dragging')});
viewport.addEventListener('pointermove',event=>{if(!drag||drag.id!==event.pointerId)return;transform.x=drag.tx+event.clientX-drag.x;transform.y=drag.ty+event.clientY-drag.y;applyTransform()});
function endDrag(event){if(!drag||drag.id!==event.pointerId)return;drag=null;viewport.classList.remove('is-dragging')}
viewport.addEventListener('pointerup',endDrag);viewport.addEventListener('pointercancel',endDrag);
window.addEventListener('resize',()=>{if(transform.scale<.2)showOverview()});
selectNode(selectedId,false);applyTransform();
})();
</script></main></body></html>
