const outputList=root.querySelector('#m1-output-list');
const focus=root.querySelector('#m1-focus-node');
const detail=root.querySelector('#m1-atomic-detail');
const indexList=root.querySelector('#m1-index-list');
const domains=[...new Set(DATA.techs.map(t=>t.domain))].sort((a,b)=>(domainNames[a]||a).localeCompare(domainNames[b]||b,'zh-CN'));
domains.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=domainNames[d]||d;domain.appendChild(o)});
let selected=DATA.techs.find(t=>t.pre.length===0)?.id||DATA.techs[0].id;

function esc(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function techButton(t){const b=document.createElement('button');b.type='button';b.className='btn m1-tech-node';b.textContent=t.name;b.addEventListener('click',()=>selectTech(t.id));return b}
function renderTechList(container,ids){container.replaceChildren();if(!ids.length){const p=document.createElement('p');p.className='m1-empty';p.textContent='无';container.appendChild(p);return}ids.map(id=>techById.get(id)).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name,'zh-CN')).forEach(t=>container.appendChild(techButton(t)))}
function renderOutputs(t){outputList.replaceChildren();t.outputs.forEach(o=>{const shared=o.requiredCount>1?' · '+o.requiredCount+' 项科技共同解锁':'';const div=document.createElement('div');div.className='m1-output-node';div.setAttribute('aria-label',o.type+'：'+o.name+shared);div.innerHTML='<span class="text-small text-muted">'+esc(o.type+shared)+'</span><span>'+esc(o.name)+'</span>';outputList.appendChild(div)})}
function renderIndex(t){indexList.replaceChildren();DATA.techs.filter(x=>x.domain===t.domain).sort((a,b)=>a.rank-b.rank||a.name.localeCompare(b.name,'zh-CN')).forEach(x=>indexList.appendChild(techButton(x)))}
function selectTech(id){const t=techById.get(id);if(!t)return;selected=id;domain.value=t.domain;focus.innerHTML='<div class="m1-focus-node"><strong>'+esc(t.name)+'</strong><span class="text-small text-muted">'+esc(t.type)+' · 科研难度层级 '+esc(t.rank)+'</span></div>';renderTechList(preList,t.pre);renderTechList(nextList,children.get(id)||[]);renderOutputs(t);renderIndex(t);detail.innerHTML='<div class="m1-detail-grid"><p class="text-muted">正文</p><p>'+esc(t.body)+'</p><p class="text-muted">后续说明</p><p>'+esc(t.second)+'</p><p class="text-muted">结构来源</p><p>'+(t.origin==='NEW-R3'?'R3 新增单项科技':t.origin===t.id?'R2 保留节点':'由 R2 候选拆分')+'</p></div>';status.textContent='当前：'+t.name+'；'+t.pre.length+' 项前置科技，'+t.outputs.length+' 项独立产物，'+(children.get(id)||[]).length+' 项直接后续科技。'}
function runSearch(){const q=search.value.trim().toLowerCase();results.replaceChildren();if(!q)return;const hits=[];DATA.techs.forEach(t=>{if(t.name.toLowerCase().includes(q)||t.body.toLowerCase().includes(q))hits.push({t,label:t.name,kind:'科技'});t.outputs.forEach(o=>{if(o.name.toLowerCase().includes(q))hits.push({t,label:o.name,kind:o.type})})});hits.slice(0,24).forEach(hit=>{const b=document.createElement('button');b.type='button';b.className='btn';b.textContent=hit.kind+'：'+hit.label;b.addEventListener('click',()=>{selectTech(hit.t.id);results.replaceChildren()});results.appendChild(b)});status.textContent=hits.length?'找到 '+hits.length+' 个匹配；显示前 '+Math.min(24,hits.length)+' 个。':'没有匹配。'}
search.addEventListener('input',runSearch);
domain.addEventListener('change',()=>{const t=DATA.techs.filter(x=>x.domain===domain.value).sort((a,b)=>a.rank-b.rank)[0];if(t)selectTech(t.id)});
root.querySelector('#m1-atomic-first').addEventListener('click',()=>{const t=DATA.techs.find(x=>x.pre.length===0);if(t)selectTech(t.id)});
selectTech(selected);
})();
</script></main></body></html>
