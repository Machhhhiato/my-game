<style>

*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--background);color:var(--foreground);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5}h1{font-size:26px;line-height:1.25;margin:0}h2{font-size:20px;line-height:1.3}h3{font-size:16px;line-height:1.35}button,input,select{font:inherit;color:inherit}.card{background:var(--card);color:var(--card-foreground);border-radius:14px}.viz-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:end}.form-label{display:flex;flex-direction:column;gap:4px;font-weight:500}.form-select,.form-control{min-height:38px;padding:7px 10px;border:1px solid var(--border);border-radius:9px;background:var(--background);color:var(--foreground)}.form-check{display:flex;align-items:center;gap:7px;min-height:38px}.form-check-input{width:18px;height:18px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--foreground);cursor:pointer;text-decoration:none}.btn:hover{background:var(--muted)}.btn:focus-visible,.form-control:focus-visible,.form-select:focus-visible{outline:2px solid var(--primary);outline-offset:2px}.btn-ghost{border-color:transparent;color:var(--muted-foreground)}.btn-ghost:hover{color:var(--foreground)}.text-small{font-size:12px}.text-muted{color:var(--muted-foreground)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}pre{font:inherit;margin:0;white-space:pre-wrap}

<body>
<div id="m1-full-mindmap">
  <style>
    #m1-full-mindmap { color: var(--foreground); }
    #m1-full-mindmap .m1-head { margin-bottom: 14px; }
    #m1-full-mindmap .m1-head p { margin: 4px 0 0; color: var(--muted-foreground); }
    #m1-full-mindmap .m1-facts { display:flex; flex-wrap:wrap; gap:7px 18px; margin-top:10px; color:var(--muted-foreground); }
    #m1-full-mindmap .m1-controls { margin:12px 0; }
    #m1-full-mindmap .m1-search-wrap { flex:1 1 250px; }
    #m1-full-mindmap .m1-search-results { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 10px; min-height:1px; }
    #m1-full-mindmap .m1-layout { display:grid; grid-template-columns:minmax(0,1.65fr) minmax(270px,.75fr); gap:16px; align-items:start; }
    #m1-full-mindmap .m1-canvas { position:relative; min-height:590px; }
    #m1-full-mindmap .m1-canvas svg { display:block; width:100%; height:590px; border:1px solid var(--border); background:color-mix(in srgb,var(--background) 94%,var(--muted)); touch-action:none; }
    #m1-full-mindmap .m1-canvas text { fill:var(--foreground); font-size:12px; font-weight:400; pointer-events:none; }
    #m1-full-mindmap .m1-canvas .m1-muted { fill:var(--muted-foreground); }
    #m1-full-mindmap .m1-canvas .m1-title { font-weight:500; }
    #m1-full-mindmap .m1-canvas .m1-edge { fill:none; vector-effect:non-scaling-stroke; }
    #m1-full-mindmap .m1-canvas .m1-hierarchy { stroke:var(--border); stroke-width:1.2; }
    #m1-full-mindmap .m1-canvas .m1-hard { stroke:var(--viz-series-1); stroke-width:1.1; opacity:.34; }
    #m1-full-mindmap .m1-canvas .m1-support { stroke:var(--viz-series-3); stroke-width:1; opacity:.18; stroke-dasharray:5 4; }
    #m1-full-mindmap .m1-canvas .m1-terminal { stroke:var(--viz-series-5); stroke-width:1.1; opacity:.28; }
    #m1-full-mindmap .m1-canvas .m1-selected-edge { opacity:.92; stroke-width:2.4; }
    #m1-full-mindmap .m1-canvas .m1-cluster { fill:color-mix(in srgb,var(--muted) 30%,transparent); stroke:var(--border); }
    #m1-full-mindmap .m1-canvas .m1-node { cursor:pointer; }
    #m1-full-mindmap .m1-canvas .m1-node circle, #m1-full-mindmap .m1-canvas .m1-node rect { vector-effect:non-scaling-stroke; }
    #m1-full-mindmap .m1-canvas .m1-node circle { fill:var(--background); stroke:var(--muted-foreground); stroke-width:1.2; }
    #m1-full-mindmap .m1-canvas .m1-node[data-kind="direction"] circle { fill:color-mix(in srgb,var(--viz-series-2) 18%,var(--background)); }
    #m1-full-mindmap .m1-canvas .m1-node[data-kind="capacity"] circle { fill:color-mix(in srgb,var(--viz-series-5) 20%,var(--background)); }
    #m1-full-mindmap .m1-canvas .m1-node[data-kind="product"] circle { fill:color-mix(in srgb,var(--viz-series-4) 16%,var(--background)); }
    #m1-full-mindmap .m1-canvas .m1-node.is-selected circle { fill:var(--primary); stroke:var(--primary); }
    #m1-full-mindmap .m1-canvas .m1-node.is-selected text { fill:var(--primary-foreground); font-weight:500; }
    #m1-full-mindmap .m1-canvas .m1-node.is-neighbor circle { stroke:var(--viz-series-1); stroke-width:2.2; }
    #m1-full-mindmap .m1-detail { position:sticky; top:10px; }
    #m1-full-mindmap .m1-detail .card { padding:15px; max-height:760px; overflow:auto; }
    #m1-full-mindmap .m1-detail h2 { margin:0 0 4px; }
    #m1-full-mindmap .m1-detail h3 { margin:14px 0 5px; }
    #m1-full-mindmap .m1-detail p { margin:0 0 7px; }
    #m1-full-mindmap .m1-detail ul { margin:5px 0 8px; padding-left:20px; }
    #m1-full-mindmap .m1-chip-row { display:flex; flex-wrap:wrap; gap:5px; }
    #m1-full-mindmap .m1-fields { margin:0; }
    #m1-full-mindmap .m1-fields div { display:grid; grid-template-columns:minmax(90px,.45fr) minmax(0,1fr); gap:9px; padding:6px 0; border-top:1px solid var(--border); }
    #m1-full-mindmap .m1-fields dt { color:var(--muted-foreground); }
    #m1-full-mindmap .m1-fields dd { margin:0; overflow-wrap:anywhere; }
    #m1-full-mindmap .m1-legend { display:flex; flex-wrap:wrap; gap:7px 16px; margin-top:7px; color:var(--muted-foreground); }
    #m1-full-mindmap .m1-line { display:inline-block; width:28px; height:0; margin-right:5px; vertical-align:middle; border-top:2px solid var(--viz-series-1); }
    #m1-full-mindmap .m1-line.support { border-top-color:var(--viz-series-3); border-top-style:dashed; }
    #m1-full-mindmap .m1-line.terminal { border-top-color:var(--viz-series-5); }
    #m1-full-mindmap .m1-outline { margin-top:22px; }
    #m1-full-mindmap .m1-outline > details, #m1-full-mindmap .m1-terminal-list > details { border-top:1px solid var(--border); }
    #m1-full-mindmap summary { cursor:pointer; padding:9px 0; font-weight:500; }
    #m1-full-mindmap .m1-direction-list { padding:0 0 9px 14px; }
    #m1-full-mindmap .m1-node-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:5px; padding:0 0 10px; }
    #m1-full-mindmap .m1-node-list .btn { justify-content:flex-start; white-space:normal; text-align:left; }
    #m1-full-mindmap .m1-terminal-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:10px 18px; }
    #m1-full-mindmap .m1-terminal-grid h3 { margin-bottom:4px; }
    #m1-full-mindmap .m1-terminal-grid p { margin:3px 0; }
    @media (max-width:760px) {
      #m1-full-mindmap .m1-layout { grid-template-columns:1fr; }
      #m1-full-mindmap .m1-detail { position:static; order:-1; }
      #m1-full-mindmap .m1-detail .card { max-height:none; }
      #m1-full-mindmap .m1-canvas, #m1-full-mindmap .m1-canvas svg { min-height:470px; height:470px; }
      #m1-full-mindmap .m1-fields div { grid-template-columns:1fr; gap:2px; }
    }
  </style>

    <div class="m1-facts text-small" aria-label="科技树数据范围"></div>

        <option value="terminal">终点能力与产品</option>
      </select>
    </label>
    <label class="form-label m1-search-wrap">搜索 ID、名称或正文

    <label class="form-check form-switch">

  <div class="m1-search-results" data-results aria-live="polite"></div>

  <div class="m1-layout">

          <g data-stage></g>
        </svg>
      </div>
      <div class="m1-legend text-small">
        <span><i class="m1-line"></i>正式直接前置</span>
        <span><i class="m1-line support"></i>跨方向能力支撑</span>
        <span><i class="m1-line terminal"></i>终点能力与产品承接</span>
      </div>
    </section>
    <aside class="m1-detail" aria-live="polite">
      <div class="card" data-detail></div>
    </aside>
  </div>

  <section class="m1-outline" aria-labelledby="m1-outline-title">
    <h2 id="m1-outline-title">完整层级目录</h2>
    <div data-outline></div>
  </section>

    <div data-terminal></div>
  </section>

些可持续能力、哪些环节仍有缺口。它不是科研解锁日，也不是强制胜负日。只要人员、知识、设施、材料、能源、路线、检验和维护等真实前置已经满足，后期科研、试制和建设都可以提前开始；到达这一日仍有缺口，恢复也可以继续。\n\n一项生产能力不能只靠科技卡、旧库存、唯一样品或刚修好的设备证明。原料与人员必须能够持续进入，工艺可以重复，设施能够安全运行，产物经过检验和交付，停机或消耗之后还能够依靠本地训练、备件与维修重新生产。\n\n### 十二项终点能力\n\n1. 能源、燃料与基础电气：能够发电、配电、储能和调度负载，并维护常用电气设备。\n2. 水务、卫生与环境工程：能够连续完成取水、净化、储配、排污、废物处理与检测。\n3. 农业、食品与储备：拥有种源、土壤管理、种植、加工、保藏、仓储和跨点供应链。\n4. 建筑、矿物材料与耐久住处：能够生产主要建材，并建设、验收和维修住处、公共设施与工业基础。\n5. 金属、标准材料与热处理：能够稳定提供结构钢、常用有色材料、铸锻件和经过检验的工业半成品。\n6. 母机、量具与通用制造：能够维护和制造基础机床、刀具、工装、量具、标准件与常用机械产品。\n7. 基础化工、肥料与工业耗材：能够安全制备和追溯水务、农业、机械、建材与军工所需的关键耗材。\n8. 运输装备、道路与区域物流：能够维护道路、桥涵、车辆、仓储和装卸，并让货物沿真实路线连续流动。\n9. 通信、仪表与有限计算：能够维持有线、无线、工业量测、数据备份与必要的人工降级运行。\n10. 医疗、公共卫生与基础医用物资：能够持续提供检疫、急救、诊疗、产育照护、转诊和可追溯的基础药品耗材。\n11. 枪械、弹药与军用保障：能够生产、检验、入库、维修和补充制式枪械与弹药，并以训练、通信、医疗、工兵、运输和补给支撑部队。\n12. 维修、回收、标准与复制：关键生产链具有维护、备件、回收、再制造、技术传承和跨地点复制能力。\n\n### 零件、耗材与养护\n\n玩家不必管理每一根轴、每一枚螺钉或每一支枪内部的零件。通用供应归入八类：通用机械件、泵阀与流体件、密封过滤与润滑件、电气与仪表件、动力与传动总成、轮胎与行走件、刀具工装与量具，以及按产品家族登记的专用备件包。钢材、玻璃、木材、燃料和化学品仍作为原材料分别保存。\n\n设备养护分为四级：使用人员负责清洁、润滑、紧固和检查等日常保养；维修人员按计划更换磨损件、校准并排除隐患；专业工场拆检总成、修复结构并重新验收；具备母机、材料、工装和完整检验以后，旧设备可以再制造并重新入库。玩家决定维护标准、备件储备、维修能力和优先顺序，不需要逐台安排每次清洁或紧固。\n\n### 能够看见的产品里程碑\n\n运输能力从人力推车起步，随后形成自行车、摩托车、轻型卡车、中型卡车和重型卡车。每次跨越都必须在实际载运、道路适应、燃料消耗、故障、维修和持续补给中体现；新产品不会自动替换库存中的旧产品。\n\n军事生产从制式枪械与配套弹药开始，再向班组支援装备、装甲侦察车、轻型坦克、中型坦克和重型坦克延伸。枪械、弹药、工兵和基础保障属于普通路线的终点能力；轻型坦克不是普通路线必达项目，中型和重型坦克更不属于普通两年路线的强制终点。它们没有日期禁令：动力、材料、武器、道路、运输、训练、燃料和专业维修等真实前置提前满足，就可以提前研究和试制。"}</script>
  <script>
  (() => {
    const root = document.getElementById('m1-full-mindmap');
    const data = JSON.parse(root.querySelector('#m1-full-data').textContent);
    const svg = root.querySelector('svg');
    const stage = root.querySelector('[data-stage]');
    const detail = root.querySelector('[data-detail]');
    const viewControl = root.querySelector('[data-view]');
    const allEdgesControl = root.querySelector('[data-all-edges]');
    const search = root.querySelector('[data-search]');
    const results = root.querySelector('[data-results]');
    const NS = 'http://www.w3.org/2000/svg';
    const nodeMap = new Map(data.nodes.map(item => [item.id, {...item, itemType:'tech'}]));
    const directionMap = new Map(data.directions.map(item => [item.id, {...item, itemType:'direction', name:item.title}]));
    const capacityMap = new Map(data.capacities.map(item => [item.id, {...item, itemType:'capacity'}]));
    const productMap = new Map(data.products.map(item => [item.id, {...item, itemType:'product', name:item['产品家族']}]));
    data.parts.forEach((item, index) => { item.id=`PART-${String(index+1).padStart(3,'0')}`; item.itemType='part'; item.name=item['零件或耗材池']; });
    data.maintenance.forEach((item, index) => { item.id=`MNT-${String(index+1).padStart(3,'0')}`; item.itemType='maintenance'; item.name=item['养护层级']; });
    const partMap = new Map(data.parts.map(item => [item.id,item]));
    const maintenanceMap = new Map(data.maintenance.map(item => [item.id,item]));
    const allItems = [...nodeMap.values(), ...directionMap.values(), ...capacityMap.values(), ...productMap.values(), ...data.parts, ...data.maintenance];
    const itemMap = new Map(allItems.map(item => [item.id,item]));
    const outgoing = new Map();
    const incoming = new Map();
    data.edges.forEach(edge => {
      if (!outgoing.has(edge.from)) outgoing.set(edge.from, []);
      if (!incoming.has(edge.to)) incoming.set(edge.to, []);
      outgoing.get(edge.from).push(edge);
      incoming.get(edge.to).push(edge);
    });
    let currentView = 'overview';
    let selectedId = 'd09';
    let viewBox = {x:0,y:0,w:1900,h:1250};
    let defaultViewBox = {...viewBox};
    let positions = new Map();
    let dragging = false;
    let dragStart = null;

    const make = (tag, attrs={}) => {
      const element = document.createElementNS(NS, tag);
      Object.entries(attrs).forEach(([key,value]) => element.setAttribute(key,String(value)));
      return element;
    };
    const html = (tag, textValue, className) => {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (textValue != null) element.textContent = textValue;
      return element;
    };
    const clear = element => { while (element.firstChild) element.removeChild(element.firstChild); };
    const truncate = (value, length) => value.length > length ? `${value.slice(0,length)}…` : value;
    const setViewBox = box => {
      viewBox = box;
      svg.setAttribute('viewBox', `${box.x} ${box.y} ${box.w} ${box.h}`);
    };
    const edgeClass = edge => edge.type === 'hard' ? 'm1-hard' : edge.type === 'support' || edge.type === 'event' ? 'm1-support' : 'm1-terminal';
    const isSelectedEdge = edge => edge.from === selectedId || edge.to === selectedId;

    root.querySelector('.m1-facts').append(
      `${data.meta.directionCount} 个方向 · ${data.meta.nodeCount} 个稳定对象 · ${data.meta.hardEdgeCount} 条正式直接前置 · ${data.meta.supportEdgeCount} 条跨方向支撑 · ${data.meta.capacityCount} 项终点能力 · ${data.meta.productCount} 个产品家族`
    );

    function addPath(edge, extra='') {
      const source = positions.get(edge.from);
      const target = positions.get(edge.to);
      if (!source || !target) return;
      const path = make('path', {d:`M ${source.x} ${source.y} C ${(source.x+target.x)/2} ${source.y}, ${(source.x+target.x)/2} ${target.y}, ${target.x} ${target.y}`});
      path.setAttribute('class', `m1-edge ${edgeClass(edge)} ${isSelectedEdge(edge)?'m1-selected-edge':''} ${extra}`);
      stage.appendChild(path);
    }

    function addNode(item, x, y, kind, label, radius=9) {
      positions.set(item.id,{x,y});
      const group = make('g', {'class':`m1-node ${item.id===selectedId?'is-selected':''}`, 'data-id':item.id, 'data-kind':kind, role:'button', 'aria-label':label});
      const neighbors = new Set([...(incoming.get(selectedId)||[]).map(e=>e.from), ...(outgoing.get(selectedId)||[]).map(e=>e.to)]);
      if (neighbors.has(item.id)) group.classList.add('is-neighbor');
      group.appendChild(make('rect',{x:x-12,y:y-13,width:190,height:27,fill:'transparent',stroke:'transparent'}));
      group.appendChild(make('circle',{cx:x,cy:y,r:radius}));
      const text = make('text',{x:x+14,y:y+4});
      text.textContent=label;
      group.appendChild(text);
      group.addEventListener('click', event => { event.stopPropagation(); selectItem(item.id,true); });
      stage.appendChild(group);
    }

    function drawOverview() {
      clear(stage); positions = new Map();
      defaultViewBox={x:0,y:0,w:1900,h:1250}; setViewBox({...defaultViewBox});
      const rootItem={id:'ROOT',name:'离开避难所'};
      positions.set('ROOT',{x:80,y:605});
      addNode(rootItem,80,605,'root','离开避难所',13);
      const macroYs=[120,360,630,890,1120];
      data.macros.forEach((macro,index)=>{
        const macroId=macro.id;
        const macroItem={id:macroId,name:macro.name,itemType:'macro'};
        itemMap.set(macroId,macroItem);
        addNode(macroItem,300,macroYs[index],'macro',macro.name,12);
        const hierarchy={from:'ROOT',to:macroId,type:'hierarchy'};
        const source=positions.get('ROOT'), target=positions.get(macroId);
        const p=make('path',{d:`M ${source.x} ${source.y} C 170 ${source.y},210 ${target.y},${target.x} ${target.y}`,'class':'m1-edge m1-hierarchy'});
        stage.insertBefore(p,stage.firstChild);
        macro.directions.forEach((directionOrder,position)=>{
          const direction=directionMap.get(`d${String(directionOrder).padStart(2,'0')}`);
          const x=540+(position%6)*215;
          const y=macroYs[index]+Math.floor(position/6)*66;
          addNode(direction,x,y,'direction',`${String(direction.order).padStart(2,'0')} ${truncate(direction.title,15)}`,10);
          const line=make('path',{d:`M 312 ${macroYs[index]} C 410 ${macroYs[index]},440 ${y},${x} ${y}`,'class':'m1-edge m1-hierarchy'});
          stage.insertBefore(line,stage.firstChild);
        });
      });
      data.capacities.forEach((capacity,index)=>{
        const x=1480+(index%2)*210;
        const y=1020+Math.floor(index/2)*38;
        addNode({...capacity,itemType:'capacity'},x,y,'capacity',`${capacity.id} ${truncate(capacity.name,13)}`,8);
      });
      data.edges.filter(edge => ['support','event','terminal'].includes(edge.type) && positions.has(edge.from) && positions.has(edge.to)).forEach(edge=>addPath(edge));
      stage.querySelectorAll('.m1-node').forEach(node=>stage.appendChild(node));
    }

    function fullLayout() {
      const cols=6, clusterW=405, left=35, top=35, gapY=28;
      const rows=[];
      for(let row=0;row<6;row++){
        const dirs=data.directions.slice(row*cols,row*cols+cols);
        const maxCount=Math.max(1,...dirs.map(d=>d.ids.length));
        rows.push(105+Math.ceil(maxCount/2)*gapY);
      }
      const rowYs=[]; let cursor=top;
      rows.forEach(height=>{rowYs.push(cursor); cursor+=height+42;});
      data.directions.forEach((direction,index)=>{
        const col=index%cols, row=Math.floor(index/cols);
        direction._box={x:left+col*clusterW,y:rowYs[row],w:370,h:rows[row]};
      });
      return {w:left+cols*clusterW,h:cursor};
    }

    function drawFull() {
      clear(stage); positions=new Map();
      const size=fullLayout(); defaultViewBox={x:0,y:0,w:size.w,h:size.h}; setViewBox({...defaultViewBox});
      data.directions.forEach(direction=>{
        const box=direction._box;
        const rect=make('rect',{x:box.x,y:box.y,width:box.w,height:box.h,'class':'m1-cluster'});
        stage.appendChild(rect);
        const title=make('text',{x:box.x+16,y:box.y+25,'class':'m1-title'});
        title.textContent=`${String(direction.order).padStart(2,'0')} · ${direction.title}（${direction.ids.length}）`;
        stage.appendChild(title);
        direction.ids.forEach((nodeId,index)=>{
          const x=box.x+28+(index%2)*180;
          const y=box.y+58+Math.floor(index/2)*28;
          addNode(nodeMap.get(nodeId),x,y,'tech',nodeId,7);
        });
      });
      const hard=data.edges.filter(edge=>edge.type==='hard');
      const visible=allEdgesControl.checked ? hard : hard.filter(edge=>isSelectedEdge(edge));
      visible.forEach(edge=>addPath(edge));
      stage.querySelectorAll('.m1-node').forEach(node=>stage.appendChild(node));
    }

    function drawTerminal() {
      clear(stage); positions=new Map();
      const height=Math.max(1500,180+data.products.length*36);
      defaultViewBox={x:0,y:0,w:1900,h:height}; setViewBox({...defaultViewBox});
      data.capacities.forEach((capacity,index)=>addNode({...capacity,itemType:'capacity'},100,85+index*105,'capacity',`${capacity.id} ${capacity.name}`,10));
      data.products.forEach((product,index)=>addNode(productMap.get(product.id),800+(index%2)*430,65+Math.floor(index/2)*62,'product',`${product.id} ${truncate(product['产品家族'],18)}`,8));
      data.parts.forEach((part,index)=>addNode(part,1450,80+index*52,'part',part.name,8));
      data.maintenance.forEach((item,index)=>addNode(item,1450,600+index*72,'maintenance',item.name,9));
      data.edges.filter(edge=>edge.type==='product' && positions.has(edge.from) && positions.has(edge.to)).forEach(edge=>addPath(edge));
      stage.querySelectorAll('.m1-node').forEach(node=>stage.appendChild(node));
    }

    function redraw() {
      if(currentView==='overview') drawOverview();
      else if(currentView==='full') drawFull();
      else drawTerminal();
    }

    function linkButtons(title, edges, key) {
      if(!edges.length) return;
      detail.appendChild(html('h3',title));
      const row=html('div',null,'m1-chip-row');
      edges.forEach(edge=>{
        const targetId=edge[key];
        const button=html('button',targetId,'btn btn-ghost');
        button.type='button'; button.addEventListener('click',()=>selectItem(targetId,true)); row.appendChild(button);
      });
      detail.appendChild(row);
    }

    function showFields(fields) {
      if(!fields || !fields.length) return;
      detail.appendChild(html('h3','结构事实'));
      const dl=html('dl',null,'m1-fields');
      fields.forEach(([key,value])=>{const row=html('div');row.append(html('dt',key),html('dd',value));dl.appendChild(row);});
      detail.appendChild(dl);
    }

    function showDetail(item) {
      clear(detail);
      if(!item){ detail.appendChild(html('p','选择一个方向、科技、终点能力或产品查看完整内容。','text-muted')); return; }
      detail.appendChild(html('p',item.id,'text-small text-muted'));
      detail.appendChild(html('h2',item.name || item.title || item.id));
      if(item.itemType==='tech'){
        detail.appendChild(html('p',`${String(item.d).padStart(2,'0')} · ${data.directions[item.d-1].title} · ${item.kind}`,'text-muted'));
        detail.appendChild(html('h3','直接效果')); detail.appendChild(html('p',item.effect||'见结构规格。'));
        detail.appendChild(html('h3','第一段正文')); detail.appendChild(html('p',item.body));
        detail.appendChild(html('h3','第二段世界内内容')); detail.appendChild(html('p',item.second));
        if(item.strength || item.form) detail.appendChild(html('p',`强度：${item.strength||'未标注'} · 形式：${item.form||'未标注'}`,'text-small text-muted'));
        linkButtons('正式直接前置',incoming.get(item.id)||[],'from');
        linkButtons('直接下游',outgoing.get(item.id)||[],'to');
        showFields(item.fields);
        if(item.check){detail.appendChild(html('h3','事实与术语边界'));detail.appendChild(html('p',item.check));}
      } else if(item.itemType==='direction'){
        detail.appendChild(html('p',`${item.ids.length} 个稳定对象 · ${item.macro}`));
        linkButtons('支撑本方向',incoming.get(item.id)||[],'from');
        linkButtons('本方向支撑',outgoing.get(item.id)||[],'to');
        detail.appendChild(html('h3','本方向节点'));
        const row=html('div',null,'m1-chip-row');
        item.ids.forEach(id=>{const button=html('button',id,'btn btn-ghost');button.type='button';button.addEventListener('click',()=>selectItem(id,true));row.appendChild(button);});detail.appendChild(row);
      } else if(item.itemType==='capacity'){
        detail.appendChild(html('p','第 730 日普通路线验收能力；真实前置满足即可提前达成。','text-muted'));
        const ul=html('ul'); item.body.forEach(value=>ul.appendChild(html('li',value))); detail.appendChild(ul);
        detail.appendChild(html('h3','直接前置说明')); detail.appendChild(html('p',item.pre));
        const related=data.products.filter(product=>product.capacities.includes(item.id));
        detail.appendChild(html('h3',`承接产品家族（${related.length}）`));
        const row=html('div',null,'m1-chip-row');related.forEach(product=>{const button=html('button',product['产品家族'],'btn btn-ghost');button.type='button';button.addEventListener('click',()=>selectItem(product.id,true));row.appendChild(button);});detail.appendChild(row);
      } else if(item.itemType==='product'){
        Object.entries(item).filter(([key])=>!['id','itemType','section','capacities'].includes(key)).forEach(([key,value])=>{detail.appendChild(html('h3',key));detail.appendChild(html('p',value));});
        linkButtons('承接终点能力',(incoming.get(item.id)||[]).filter(e=>e.type==='product'),'from');
      } else if(item.itemType==='part'){
        detail.appendChild(html('h3','覆盖对象')); detail.appendChild(html('p',item['覆盖对象']));
        detail.appendChild(html('h3','玩家理解')); detail.appendChild(html('p',item['玩家理解']));
      } else if(item.itemType==='maintenance'){
        ['工作内容','需要什么','结果'].forEach(key=>{detail.appendChild(html('h3',key));detail.appendChild(html('p',item[key]));});
      } else if(item.itemType==='macro'){
        const macro=data.macros.find(value=>value.id===item.id);
        detail.appendChild(html('p',`${macro.directions.length} 个方向`));
        const row=html('div',null,'m1-chip-row');macro.directions.forEach(order=>{const id=`d${String(order).padStart(2,'0')}`;const button=html('button',`${String(order).padStart(2,'0')} ${directionMap.get(id).title}`,'btn btn-ghost');button.type='button';button.addEventListener('click',()=>selectItem(id,true));row.appendChild(button);});detail.appendChild(row);
      }
    }

    function viewForItem(item) {
      if(item.itemType==='tech') return 'full';
      if(['capacity','product','part','maintenance'].includes(item.itemType)) return 'terminal';
      return 'overview';
    }

    function selectItem(id, switchView=false) {
      const item=itemMap.get(id);
      if(!item) return;
      selectedId=id;
      if(switchView){currentView=viewForItem(item);viewControl.value=currentView;}
      redraw(); showDetail(item);
      const point=positions.get(id);
      if(point && switchView){
        const width=currentView==='full'?900:currentView==='terminal'?1100:1000;
        const height=width*0.62;
        setViewBox({x:Math.max(0,point.x-width/2),y:Math.max(0,point.y-height/2),w:width,h:height});
      }
    }

    function populateOutline() {
      const outline=root.querySelector('[data-outline]');
      data.macros.forEach(macro=>{
        const group=html('details');const summary=html('summary',`${macro.name}（${macro.directions.length} 个方向）`);group.appendChild(summary);
        const holder=html('div',null,'m1-direction-list');
        macro.directions.forEach(order=>{
          const direction=data.directions[order-1];const section=html('details');section.appendChild(html('summary',`${String(order).padStart(2,'0')} · ${direction.title}（${direction.ids.length} 项）`));
          const list=html('div',null,'m1-node-list');direction.ids.forEach(id=>{const node=nodeMap.get(id);const button=html('button',`${id} · ${node.name}`,'btn btn-ghost');button.type='button';button.addEventListener('click',()=>selectItem(id,true));list.appendChild(button);});section.appendChild(list);holder.appendChild(section);
        });group.appendChild(holder);outline.appendChild(group);
      });
    }

    function populateTerminal() {
      const holder=root.querySelector('[data-terminal]');
      const note=html('details');note.appendChild(html('summary','第 730 日终点玩家说明（完整正文）'));const pre=html('pre');pre.style.whiteSpace='pre-wrap';pre.textContent=data.terminalText;note.appendChild(pre);holder.appendChild(note);
      const capacities=html('details');capacities.appendChild(html('summary',`十二项终点生产能力（${data.capacities.length}）`));const cgrid=html('div',null,'m1-terminal-grid');data.capacities.forEach(item=>{const section=html('section');const button=html('button',`${item.id} · ${item.name}`,'btn btn-ghost');button.type='button';button.addEventListener('click',()=>selectItem(item.id,true));section.appendChild(button);const ul=html('ul');item.body.forEach(value=>ul.appendChild(html('li',value)));section.appendChild(ul);section.appendChild(html('p',`直接前置：${item.pre}`,'text-small text-muted'));cgrid.appendChild(section);});capacities.appendChild(cgrid);holder.appendChild(capacities);
      const products=html('details');products.appendChild(html('summary',`终点产品家族（${data.products.length}）`));const pgrid=html('div',null,'m1-terminal-grid');data.products.forEach(item=>{const section=html('section');const button=html('button',`${item.id} · ${item['产品家族']}`,'btn btn-ghost');button.type='button';button.addEventListener('click',()=>selectItem(item.id,true));section.appendChild(button);section.appendChild(html('p',item['第 730 日生产层级']||item['第 730 日普通路线']));section.appendChild(html('p',item['玩家可见里程碑']||item['里程碑梯度'],'text-small'));section.appendChild(html('p',`零件/耗材：${item['聚合零件/耗材']}`,'text-small text-muted'));section.appendChild(html('p',`养护：${item['主要养护']}`,'text-small text-muted'));pgrid.appendChild(section);});products.appendChild(pgrid);holder.appendChild(products);
      const pools=html('details');pools.appendChild(html('summary',`通用零件与耗材池（${data.parts.length}）`));const poolGrid=html('div',null,'m1-terminal-grid');data.parts.forEach(item=>{const section=html('section');const button=html('button',item.name,'btn btn-ghost');button.type='button';button.addEventListener('click',()=>selectItem(item.id,true));section.append(button,html('p',item['覆盖对象']),html('p',item['玩家理解'],'text-small text-muted'));poolGrid.appendChild(section);});pools.appendChild(poolGrid);holder.appendChild(pools);
      const maint=html('details');maint.appendChild(html('summary',`四级养护（${data.maintenance.length}）`));const mgrid=html('div',null,'m1-terminal-grid');data.maintenance.forEach(item=>{const section=html('section');const button=html('button',item.name,'btn btn-ghost');button.type='button';button.addEventListener('click',()=>selectItem(item.id,true));section.append(button,html('p',item['工作内容']),html('p',`需要：${item['需要什么']}`,'text-small text-muted'),html('p',`结果：${item['结果']}`,'text-small text-muted'));mgrid.appendChild(section);});maint.appendChild(mgrid);holder.appendChild(maint);
    }

    function searchIndex(item) {
      return [item.id,item.name,item.title,item.body,item.second,item.effect,item['产品家族'],item['玩家可见里程碑'],item['里程碑梯度']].filter(Boolean).join(' ').toLowerCase();
    }
    search.addEventListener('input',()=>{
      clear(results);const term=search.value.trim().toLowerCase();if(!term)return;
      const matches=allItems.filter(item=>searchIndex(item).includes(term)).slice(0,10);
      matches.forEach(item=>{const button=html('button',`${item.id} · ${item.name||item.title}`,'btn btn-ghost');button.type='button';button.addEventListener('click',()=>{selectItem(item.id,true);search.value='';clear(results);});results.appendChild(button);});
      if(!matches.length)results.appendChild(html('span','没有匹配项。','text-muted'));
    });
    viewControl.addEventListener('change',()=>{currentView=viewControl.value;selectedId=currentView==='overview'?'d09':currentView==='terminal'?'P06':'MCH-RES-001';redraw();showDetail(itemMap.get(selectedId));});
    allEdgesControl.addEventListener('change',()=>{if(currentView==='full')redraw();});
    root.querySelector('[data-reset]').addEventListener('click',()=>setViewBox({...defaultViewBox}));
    svg.addEventListener('wheel',event=>{event.preventDefault();const scale=event.deltaY>0?1.12:.89;const rect=svg.getBoundingClientRect();const px=viewBox.x+(event.clientX-rect.left)/rect.width*viewBox.w;const py=viewBox.y+(event.clientY-rect.top)/rect.height*viewBox.h;const nw=viewBox.w*scale,nh=viewBox.h*scale;setViewBox({x:px-(px-viewBox.x)*scale,y:py-(py-viewBox.y)*scale,w:nw,h:nh});},{passive:false});
    svg.addEventListener('pointerdown',event=>{if(event.target.closest('.m1-node'))return;dragging=true;svg.setPointerCapture(event.pointerId);dragStart={x:event.clientX,y:event.clientY,box:{...viewBox}};});
    svg.addEventListener('pointermove',event=>{if(!dragging)return;const rect=svg.getBoundingClientRect();setViewBox({x:dragStart.box.x-(event.clientX-dragStart.x)/rect.width*dragStart.box.w,y:dragStart.box.y-(event.clientY-dragStart.y)/rect.height*dragStart.box.h,w:dragStart.box.w,h:dragStart.box.h});});
    svg.addEventListener('pointerup',()=>{dragging=false;});svg.addEventListener('pointercancel',()=>{dragging=false;});
    populateOutline();populateTerminal();drawOverview();showDetail(directionMap.get('d09'));
  })();
  </script>
</div>
</body>
</html>
